# Desenvolvimento local: apenas PostgreSQL. API/web rodam com `pnpm dev`.
name: rebania-dev
services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16.9-alpine}
    environment:
      POSTGRES_DB: rebania
      POSTGRES_USER: rebania
      POSTGRES_PASSWORD: rebania
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - rebania_dev_pgdata:/var/lib/postgresql/data
volumes:
  rebania_dev_pgdata:
