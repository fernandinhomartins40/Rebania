# Nginx do HOST (VPS 72.60.10.112) para www.rebania.com.br.
# Instalado uma única vez por infra/scripts/setup-host.sh; o certbot acrescenta
# o bloco HTTPS (listen 443 + certificado) e o redirecionamento HTTP->HTTPS.
# O compose do Rebania só escuta em 127.0.0.1:8088 (REBANIA_HTTP_PORT).

# Domínio sem www -> www (endereço canônico, igual ao PUBLIC_URL).
server {
  listen 80;
  listen [::]:80;
  server_name rebania.com.br;
  return 301 https://www.rebania.com.br$request_uri;
}

server {
  listen 80;
  listen [::]:80;
  server_name www.rebania.com.br;

  client_max_body_size 4m;

  location / {
    proxy_pass http://127.0.0.1:8088;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 60s;
  }
}
