# Nginx INTERNO do Rebania. Fica atrás do proxy/ingress já existente na VPS
# (ou numa porta loopback dedicada) — nunca disputa 80/443 com outras aplicações.
# TLS termina no proxy existente; este servidor escuta só na rede do compose.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  client_max_body_size 4m;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

  include /etc/nginx/snippets/rebania-security-headers.conf;

  location = /healthz { access_log off; return 200 "ok\n"; }

  # API na mesma origem: cookie httpOnly SameSite=Strict funciona sem CORS.
  location /v1/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 60s;
  }

  # Assets com hash no nome: cache longo.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/snippets/rebania-security-headers.conf;
    try_files $uri =404;
  }

  location = /sw.js {
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/rebania-security-headers.conf;
    try_files $uri =404;
  }
  # O mime.types do Nginx não conhece .webmanifest (sairia application/octet-stream).
  location = /manifest.webmanifest {
    types { }
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/rebania-security-headers.conf;
    try_files $uri =404;
  }

  # SPA: rotas do app caem no index.html.
  location / {
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/rebania-security-headers.conf;
    try_files $uri $uri/ /index.html;
  }
}
