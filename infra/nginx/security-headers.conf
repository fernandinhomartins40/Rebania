# Cabeçalhos de segurança do Rebania. No Nginx, um add_header dentro de um location
# anula os herdados do server: por isso este arquivo é incluído no server E em cada
# location que tem add_header próprio (rebania.conf).
# 'wasm-unsafe-eval': o leitor de QR/código no iPhone usa WebAssembly (ZXing), servido daqui.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(self), publickey-credentials-get=(self), publickey-credentials-create=(self)" always;
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
