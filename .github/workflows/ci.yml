name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16.9-alpine
        env:
          POSTGRES_USER: rebania
          POSTGRES_PASSWORD: rebania
          POSTGRES_DB: rebania
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rebania" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://rebania:rebania@localhost:5432/rebania
      TEST_DATABASE_URL: postgresql://rebania:rebania@localhost:5432/rebania_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm format:check
      - run: pnpm turbo run typecheck lint test
      - run: pnpm test:integration
      - run: pnpm --filter @rebania/db exec prisma migrate diff --from-migrations prisma/migrations --to-schema prisma/schema.prisma --exit-code
        env:
          SHADOW_DATABASE_URL: postgresql://rebania:rebania@localhost:5432/rebania_shadow
        name: Schema e migrations em sincronia
      - run: pnpm turbo run build --filter=@rebania/api --filter=@rebania/worker --filter=@rebania/web

  images:
    runs-on: ubuntu-24.04
    needs: verify
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build das imagens (sem publicar)
        run: |
          for t in api worker migrate; do
            docker build -f infra/docker/node.Dockerfile --target $t -t rebania-$t:ci .
          done
          docker build -f infra/docker/web.Dockerfile -t rebania-web:ci .
