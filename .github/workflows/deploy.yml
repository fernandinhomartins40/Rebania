name: Deploy (GHCR -> VPS 112)

# Mesmo modelo do DigiUrban (build-images.yml), adaptado ao Rebania:
# - as imagens são construídas em runners do GitHub e publicadas no GHCR;
# - a VPS 72.60.10.112 só faz `pull` e sobe (nunca compila);
# - o deploy entra na VPS 112 por SSH com senha; o ÚNICO secret é VPS_PASSWORD
#   (o GITHUB_TOKEN usado no GHCR é automático do GitHub, não é configurado);
# - backup antes das migrações, healthcheck e rollback automático em
#   infra/scripts/deploy.sh.
# Rollback manual: "Run workflow" informando `release` = SHA já publicado.

"on":
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: SHA de uma release já publicada no GHCR (vazio = construir o commit atual)
        required: false
        default: ""

permissions:
  contents: read
  packages: write

# Um deploy por vez; vale o último commit.
concurrency:
  group: deploy-rebania-vps112
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  OWNER: fernandinhomartins40

jobs:
  verify:
    if: ${{ !inputs.release }}
    uses: ./.github/workflows/ci.yml
    with:
      skip_images: true

  build:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: rebania-api
            dockerfile: infra/docker/node.Dockerfile
            target: api
          - name: rebania-worker
            dockerfile: infra/docker/node.Dockerfile
            target: worker
          - name: rebania-migrate
            dockerfile: infra/docker/node.Dockerfile
            target: migrate
          - name: rebania-web
            dockerfile: infra/docker/web.Dockerfile
            target: web
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build e push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          # `latest` para conveniência; o deploy usa sempre o SHA (rollback exato).
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.name }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.name }}:latest
          labels: |
            project=rebania
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.name }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.name }}:buildcache,mode=max
          provenance: false
          sbom: false

  deploy:
    needs: build
    # Roda também no rollback manual (build pulado), mas nunca se algo falhou.
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: production
      url: https://www.rebania.com.br
    env:
      VPS_HOST: 72.60.10.112
      VPS_USER: root
      APP_DIR: /opt/rebania
      RELEASE: ${{ inputs.release || github.sha }}
      # ÚNICO secret do deploy. Usado só pelo sshpass (-e lê de SSHPASS), nunca impresso.
      SSHPASS: ${{ secrets.VPS_PASSWORD }}
    steps:
      - name: Checkout (só a infraestrutura)
        uses: actions/checkout@v4
        with:
          sparse-checkout: infra
          ref: ${{ inputs.release || github.sha }}

      - name: Preparar SSH
        run: |
          set -e
          if [ -z "$SSHPASS" ]; then
            echo "::error::Secret VPS_PASSWORD não configurado (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass >/dev/null
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -T 15 -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Enviar compose, scripts e vhost para /opt/rebania (o .env da VPS não é tocado)
        run: |
          set -e
          tar -czf - --exclude='compose/.env' --exclude='compose/docker-compose.dev.yml' infra \
            | sshpass -e ssh -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
                "mkdir -p '$APP_DIR' && tar -xzf - -C '$APP_DIR' && chmod 755 '$APP_DIR'/infra/scripts/*.sh"

      - name: Preparar a VPS (idempotente) e fazer o deploy
        env:
          # Token automático da execução (não é secret configurado): só para o pull no GHCR.
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          set -e
          printf '%s\n' "$GHCR_TOKEN" | sshpass -e ssh -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            "set -e
             cd '$APP_DIR'
             docker login ghcr.io -u '$GHCR_USER' --password-stdin
             trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
             APP_DIR='$APP_DIR' infra/scripts/setup-host.sh
             RELEASE='$RELEASE' APP_DIR='$APP_DIR' REGISTRY='ghcr.io/$OWNER/' infra/scripts/deploy.sh"

      - name: Resumo
        if: success()
        run: |
          echo "Rebania publicado: https://www.rebania.com.br (release ${RELEASE})"
          echo "Health: https://www.rebania.com.br/v1/health"
